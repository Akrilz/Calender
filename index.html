<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Thời khóa biểu các lớp">
  <title>Thời khóa biểu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <section class="schedule-card" aria-labelledby="schedule-title">
      <div class="card-heading">
        <h1 id="schedule-title">Thời khóa biểu</h1>
        <div class="heading-actions">
          <label class="class-picker" for="class-select">
            <span class="sr-only">Chọn lớp</span>
            <select id="class-select" hidden disabled>
              <option>Đang tải lớp...</option>
            </select>
          </label>
          <div class="sync-status" id="sync-status" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="sync-message">Đang kết nối Google Sheets...</span>
          </div>
          <button class="refresh-button" id="refresh-button" type="button" title="Tải lại dữ liệu">
            ↻ Cập nhật
          </button>
        </div>
      </div>

      <div class="table-scroll" role="region" aria-label="Bảng thời khóa biểu, có thể cuộn ngang trên màn hình nhỏ" tabindex="0">
        <table class="schedule-table">
          <thead>
            <tr>
              <th class="period-heading" scope="col">Ca</th>
              <th scope="col" data-day="1">Thứ 2<span class="today-label"></span></th>
              <th scope="col" data-day="2">Thứ 3<span class="today-label"></span></th>
              <th scope="col" data-day="3">Thứ 4<span class="today-label"></span></th>
              <th scope="col" data-day="4">Thứ 5<span class="today-label"></span></th>
              <th scope="col" data-day="5">Thứ 6<span class="today-label"></span></th>
              <th scope="col" data-day="6">Thứ 7<span class="today-label"></span></th>
              <th scope="col" data-day="0">Chủ nhật<span class="today-label"></span></th>
            </tr>
          </thead>
          <tbody id="schedule-body">
            <tr>
              <td class="table-message" colspan="8">Đang tải thời khóa biểu...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="data-note" id="data-note">Dữ liệu được tải từ Google Sheets.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
